<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/media/photo/user.svg" />

    <link rel="stylesheet" href="../css/style.css" />
    <title>Login</title>
  </head>
  <body>

    <!-- login -->
    <section class="login-section">
      <div class="login active">
        <form class="form-login">
          <div class="logo-style">
            <p class="logo">RepoNew</p>
          </div>
          <div class="header-login">
            <h2 class="h-login">Login Form</h2>
          </div>
          <div class="form-style">
            <label for="user">Mobile:</label>
            <input
              type="text"
              id="user"
              class="user-login input"
              placeholder="Enter PhoneNumber"
              autocomplete="off"
            />

            <button class="loginPage-btn">otp</button>
          </div>
        </form>
      </div>
      <!-- otp -->
      <div class="otp">
        <form class="form-otp">
          <div class="logo-style">
            <p class="logo">RepoNew</p>
          </div>
          <div class="header-otp">
            <h2 class="h-otp">Otp Form</h2>
          </div>
          <div class="form-style">
            <label for="user">OtpCode</label>
            <input
              type="text"
              id="user"
              class="user-otp input"
              placeholder="Enter otp"
              autocomplete="off"
            />

            <button class="otpPage-btn">Login</button>
          </div>
        </form>
      </div>
      <div class="error"></div>
    </section>

    <script src="../js/login.js"></script>
  </body>
</html>
